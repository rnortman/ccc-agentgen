name = "freeform"

# Frontmatter applied to every role; a `[roles.<id>]` table below overrides it,
# and an operator's `[agents.<type>]` ccc config overrides that.
[defaults]
model = "claude-opus-5-5[1M]"
effort = "medium"
codex_model = "gpt-6-sol"
codex_effort = "medium"
codex_sandbox = "workspace-write"

[roles.lead]
model = "claude-fable-5-2[1M]"
codex_model = "gpt-6-astra"

# TODO(freeform-worker-mcp-reach): `worker` and `worker-high` are unrestricted
# and hold every MCP server of the account (profile or ambient login) ccc
# launches them under; see TODO.md.
[roles.worker]

[roles.worker-high]
model = "claude-fable-5-2[1M]"
codex_model = "gpt-6-astra"

[roles.explorer]
effort = "low"
model = "claude-opus-5-5[1M]"
codex_model = "gpt-6-luna"
codex_effort = "medium"

[roles.contrarian]
model = "claude-fable-5-2[1M]"
codex_model = "gpt-6-sol"
description = "Fact-checks a document against its sources and against what it answers, and argues both cases harder than the document did. Changes nothing, rules on nothing."

[roles.code-reviewer]
