name = "project-burndown"

# A multi-cycle project: the project forester plans each cycle and digests
# it into the project state; a build cycle runs the embedded stack chain,
# whose stacks chain cycle on cycle into one stack of branches.

# Frontmatter applied to every role; a `[roles.<id>]` table below overrides it,
# and an operator's `[agents.<type>]` ccc config overrides that.
[defaults]
model = "claude-opus-5-5[1M]"
effort = "medium"
codex_model = "gpt-6-sol"
codex_effort = "medium"
codex_sandbox = "workspace-write"

# Knobs the templates read.
[vars]
# Stack sizing: the designer sizes each PR near the target; the max stops an
# open PR that overruns. max_increments is a stall guard per PR.
pr_target_lines = 1000
pr_max_lines = 2000
increment_target_min = 400
increment_target_max = 800
increment_stop_lines = 1200
max_increments = 4
designer_spawns_explorers = true
# Forester: "advise" briefs the user before each gate listed; "decide" holds
# the gate. Gate rounds cap the forester↔designer loop on design and triage.
forester_autonomy = "advise"
forester_gates = ["design", "triage", "scan", "ship"]
forester_gate_rounds = 2
# Project: the project forester sizes a build cycle near this many added
# lines, a few PRs of pr_target_lines each.
cycle_target_lines = 4000

[roles.project-orchestrator]
model = "claude-opus-5-5[1M]"
effort = "low"
codex_model = "gpt-5.6-terra"

[roles.orchestrator]
model = "claude-opus-5-5[1M]"
effort = "low"
codex_model = "gpt-5.6-terra"

