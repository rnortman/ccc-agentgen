name = "review-chain-planner-auto"

# The review chain with a planner in front of the implementer: the planner
# chooses the slice and writes the plan; the implementer builds it unsupervised
# and sends a plan it cannot build back as a replan.
[defaults]
codex_sandbox = "workspace-write"

[vars]
plan_target_min = 500
plan_target_max = 1000
unit_retry_cap = 3
round_cap_lines = 5000
max_increments = 7
designer_spawns_explorers = true
forester_autonomy = "decide"
forester_gates = ["design", "triage", "scan", "ship"]
forester_gate_rounds = 2

[roles.orchestrator]
model = "claude-opus-5-5[1M]"
effort = "low"
codex_model = "gpt-5.6-terra"
codex_effort = "low"

[roles.designer]
model = "claude-fable-5-1[1M]"
effort = "medium"
codex_model = "gpt-6-sol"
codex_effort = "medium"

[roles.explorer]
model = "claude-opus-5-5[1M]"
effort = "low"
codex_model = "gpt-6-luna"
codex_effort = "medium"

[roles.design-reviewer]
model = "claude-opus-5-5[1M]"
effort = "medium"
codex_model = "gpt-6-sol"
codex_effort = "medium"

[roles.eli5-explainer]
model = "claude-opus-4-6[1M]"
effort = "medium"
codex_model = "gpt-5.6-terra"
codex_effort = "medium"

[roles.planner]
description = "Chooses the next increment of the design and writes a stand-alone plan the implementer builds without further judgement; in respond mode, rules on review findings and specifies each fix. Writes documents only."
#model = "claude-fable-5-1[1M]"
model = "claude-opus-5-5[1M]"
effort = "medium"
codex_model = "gpt-6-sol"
codex_effort = "medium"

[roles.implementer]
description = "Implements a planner's plan or dispositions document exactly, checks its own work against it, commits and logs. Sends a plan it cannot build back to the planner."
model = "claude-opus-5-5[1M]"
effort = "medium"
codex_model = "gpt-6-sol"
codex_effort = "medium"

[roles.comment-rewriter]
model = "claude-opus-4-6[1M]"
effort = "low"
codex_model = "gpt-5.6-terra"
codex_effort = "low"

[roles.prepass-reviewer]
