name = "review-chain-split"

# The review chain with the implementer split into planner, coder-supervisor
# and coder. `harness` makes coder Codex-only and coder-supervisor Claude-only;
# keeping models per role is a tuning choice, not a requirement for pinning.
[defaults]
codex_sandbox = "workspace-write"

[vars]
plan_target_min = 500
plan_target_max = 1000
unit_retry_cap = 3
round_cap_lines = 5000
max_increments = 7
designer_spawns_explorers = true
forester_autonomy = "advise"
forester_gates = ["design", "triage", "scan", "ship"]
forester_gate_rounds = 2

[roles.orchestrator]
model = "claude-opus-5-5[1M]"
effort = "low"
codex_model = "gpt-5.6-terra"
codex_effort = "low"

[roles.designer]
model = "claude-fable-5-1[1M]"
effort = "medium"
codex_model = "gpt-6-sol"
codex_effort = "medium"

[roles.explorer]
model = "claude-opus-5-5[1M]"
effort = "low"
codex_model = "gpt-6-luna"
codex_effort = "medium"

[roles.design-reviewer]
model = "claude-opus-5-5[1M]"
effort = "medium"
codex_model = "gpt-6-sol"
codex_effort = "medium"

[roles.eli5-explainer]
model = "claude-opus-4-6[1M]"
effort = "medium"
codex_model = "gpt-5.6-terra"
codex_effort = "medium"

[roles.planner]
#model = "claude-fable-5-1[1M]"
model = "claude-opus-5-5[1M]"
effort = "medium"
codex_model = "gpt-6-sol"
codex_effort = "medium"

[roles.coder-supervisor]
harness = "claude"
model = "claude-opus-5-5[1M]"
effort = "medium"

[roles.coder]
harness = "codex"
codex_model = "gpt-6-luna"
codex_effort = "medium"

[roles.comment-rewriter]
model = "claude-opus-4-6[1M]"
effort = "low"
codex_model = "gpt-5.6-terra"
codex_effort = "low"

[roles.prepass-reviewer]
model = "claude-opus-5-5[1M]"
effort = "low"
codex_model = "gpt-5.6-terra"
codex_effort = "medium"

[roles.citizen-reviewer]
model = "claude-opus-5-5[1M]"
effort = "medium"
codex_model = "gpt-6-sol"
codex_effort = "medium"

[roles.tracer-reviewer]
model = "claude-opus-5-5[1M]"
effort = "high"
codex_model = "gpt-6-sol"
codex_effort = "high"

[roles.test-reviewer]
model = "claude-opus-5-5[1M]"
effort = "low"
codex_model = "gpt-6-sol"
codex_effort = "low"

[roles.judge]
model = "claude-opus-5-5[1M]"
effort = "medium"
codex_model = "gpt-6-sol"
codex_effort = "medium"

[roles.workflow-scanner]
model = "claude-opus-5-5[1M]"
effort = "medium"
codex_model = "gpt-6-sol"
codex_effort = "medium"

[roles.changelog-author]
model = "claude-opus-4-6[1M]"
effort = "medium"
codex_model = "gpt-5.6-terra"
codex_effort = "medium"

[roles.forester]
model = "claude-fable-5-1[1M]"
effort = "medium"
codex_model = "gpt-6-astra"
codex_effort = "medium"

[roles.forester-commentator]
